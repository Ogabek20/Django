<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ event.title }} — Tafsilotlar</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .detail-card {
            background: rgba(255, 255, 255, 0.97);
            width: 100%;
            max-width: 520px;
            border-radius: 22px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
            overflow: hidden;
            animation: fadeUp 0.4s ease;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .detail-header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            padding: 36px 34px;
        }

        .detail-header .label {
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0.8;
            font-weight: 600;
        }

        .detail-header h1 {
            font-size: 1.9rem;
            font-weight: 700;
            margin-top: 8px;
            line-height: 1.25;
        }

        .detail-body {
            padding: 32px 34px;
        }

        .info-row {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px 0;
            border-bottom: 1px solid #eee;
        }

        .info-row:last-of-type { border-bottom: none; }

        .info-row .icon {
            width: 46px;
            height: 46px;
            border-radius: 14px;
            background: linear-gradient(135deg, #667eea20, #764ba230);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            flex-shrink: 0;
        }

        .info-row .text-label {
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #999;
            font-weight: 600;
        }

        .info-row .value {
            color: #2d2d44;
            font-weight: 500;
            font-size: 1.05rem;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 26px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.92rem;
            padding: 12px 26px;
            border-radius: 30px;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .back-link:hover {
            opacity: 0.88;
            transform: translateX(-4px);
        }
    </style>
</head>
<body>
    <div class="detail-card">
        <div class="detail-header">
            <span class="label">Tadbir tafsilotlari</span>
            <h1>{{ event.title }}</h1>
        </div>

        <div class="detail-body">
            <div class="info-row">
                <div class="icon">📅</div>
                <div>
                    <div class="text-label">Sana</div>
                    <div class="value">{{ event.date }}</div>
                </div>
            </div>

            <div class="info-row">
                <div class="icon">📍</div>
                <div>
                    <div class="text-label">Joylashuv</div>
                    <div class="value">{{ event.location }}</div>
                </div>
            </div>

            <a href="{% url 'event_list' %}" class="back-link">← Tadbirlarga qaytish</a>
        </div>
    </div>
</body>
</html>
