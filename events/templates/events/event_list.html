<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tadbirlar</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Poppins", sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        padding: 40px 20px;
      }

      .container {
        max-width: 1000px;
        margin: 0 auto;
      }

      header {
        text-align: center;
        color: #fff;
        margin-bottom: 50px;
      }

      header h1 {
        font-size: 2.8rem;
        font-weight: 700;
        letter-spacing: 1px;
      }

      header p {
        opacity: 0.85;
        font-size: 1.1rem;
        margin-top: 8px;
      }

      /* ---- Event cards ---- */
      .events-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 25px;
      }

      .event-card {
        background: rgba(255, 255, 255, 0.95);
        border-radius: 18px;
        padding: 28px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        transition:
          transform 0.25s ease,
          box-shadow 0.25s ease;
        position: relative;
        overflow: hidden;
      }

      .event-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 5px;
        background: linear-gradient(90deg, #667eea, #764ba2);
      }

      .event-card:hover {
        transform: translateY(-8px);
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.25);
      }

      .event-card h2 {
        font-size: 1.35rem;
        font-weight: 600;
        color: #2d2d44;
        margin-bottom: 14px;
        line-height: 1.3;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: linear-gradient(135deg, #667eea20, #764ba220);
        color: #5a4fcf;
        font-size: 0.85rem;
        font-weight: 600;
        padding: 5px 12px;
        border-radius: 20px;
        margin-bottom: 8px;
      }

      .event-card p {
        color: #666;
        font-size: 0.95rem;
        margin: 8px 0;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .event-card a {
        display: inline-block;
        margin-top: 14px;
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: #fff;
        text-decoration: none;
        font-weight: 600;
        font-size: 0.9rem;
        padding: 10px 22px;
        border-radius: 30px;
        transition:
          opacity 0.2s ease,
          transform 0.2s ease;
      }

      .event-card a:hover {
        opacity: 0.88;
        transform: scale(1.03);
      }

      /* ---- Empty state ---- */
      .empty {
        text-align: center;
        background: rgba(255, 255, 255, 0.95);
        border-radius: 18px;
        padding: 60px 30px;
        color: #555;
      }

      .empty span {
        font-size: 3rem;
      }
      .empty h2 {
        margin: 12px 0 6px;
        color: #2d2d44;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>🎉 Tadbirlar</h1>
        <p>Barcha yaqinlashib kelayotgan tadbirlar ro'yxati</p>
      </header>

      {% if events %}
      <div class="events-grid">
        {% for event in events %}
        <div class="event-card">
          <span class="badge">📅 {{ event.date }}</span>
          <h2>{{ event.title }}</h2>
          <p>📍 {{ event.location }}</p>
          <a href="{% url 'event_detail' event.id %}">Batafsil →</a>
        </div>
        {% endfor %}
      </div>
      {% else %}
      <div class="empty">
        <span>📭</span>
        <h2>Hozircha tadbirlar yo'q</h2>
        <p>Admin panelda tadbir qo'shing: <a href="/admin/">/admin</a></p>
      </div>
      {% endif %}
    </div>
  </body>
</html>
